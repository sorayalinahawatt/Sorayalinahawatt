<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soraya Lina Hawatt | International Relations & Diplomacy</title>
    <meta name="description" content="A young Moroccan-Australian voice in diplomacy, international relations, climate leadership, and public discourse.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Variables: Oxford Blue, Antique Gold, Parchment */
        :root {
            --oxford-blue: #0f1d2b;
            --oxford-dark: #0a131c;
            --antique-gold: #9e8250;
            --gold-light: rgba(158, 130, 80, 0.2);
            --parchment: #f4f1ea;
            --parchment-dark: #e8e3d8;
            --text-dark: #2c363f;
            --text-light: rgba(244, 241, 234, 0.85);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--parchment);
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
            font-weight: 300;
        }

        h1, h2, h3, h4, h5, .serif {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            color: var(--oxford-blue);
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: transparent;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: var(--transition);
            border-bottom: 1px solid transparent;
        }

        nav.scrolled {
            background-color: var(--oxford-blue);
            padding: 1rem 5%;
            border-bottom: 1px solid var(--gold-light);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 65px; 
            width: auto;
            mix-blend-mode: lighten;
            transition: var(--transition);
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--parchment);
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: var(--antique-gold);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--antique-gold);
        }

        /* Hero Section - Oxford Style */
        .hero {
            height: 100vh;
            background-color: var(--oxford-blue);
            color: var(--parchment);
            padding: 1.5rem;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55vh;
            height: 55vh;
            background-image: url('32f116d1-bf3c-4dae-8c36-e1c95b6f58ec.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.05;
            mix-blend-mode: lighten;
            pointer-events: none;
            z-index: 0;
        }

        .hero-inner {
            border: 1px solid rgba(158, 130, 80, 0.4);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            position: relative;
            z-index: 1;
        }

        .hero-inner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 100px;
            background-color: var(--antique-gold);
        }

        .hero h1 {
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            margin-bottom: 1rem;
            letter-spacing: 2px;
            color: var(--parchment);
            font-weight: 500;
        }

        .hero p.subtitle {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: var(--antique-gold);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 2rem;
        }

        .hero p.desc {
            max-width: 600px;
            color: var(--text-light);
            font-weight: 300;
            font-size: 1.05rem;
            margin-bottom: 4rem;
            line-height: 1.9;
        }

        .btn {
            display: inline-block;
            padding: 1rem 3.5rem;
            border: 1px solid var(--antique-gold);
            color: var(--antique-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.75rem;
            background: transparent;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: var(--antique-gold);
            transition: var(--transition);
            z-index: -1;
        }

        .btn:hover::before {
            width: 100%;
        }

        .btn:hover {
            color: var(--oxford-blue);
        }

        .btn-solid {
            background: var(--oxford-blue);
            color: var(--parchment);
            border: 1px solid var(--oxford-blue);
        }

        .btn-solid::before {
            background: var(--oxford-dark);
        }

        .btn-solid:hover {
            color: var(--antique-gold);
            border-color: var(--oxford-dark);
        }

        /* Layout Sections */
        section {
            padding: 8rem 5%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 5rem;
        }

        .section-header h2 {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .section-header .divider {
            width: 40px;
            height: 1px;
            background-color: var(--antique-gold);
            margin: 0 auto;
        }

        /* 3-Column Focus Grid */
        .focus-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .focus-card {
            background-color: transparent;
            padding: 3rem 2rem;
            text-align: center;
            border: 1px solid var(--gold-light);
            transition: var(--transition);
            position: relative;
        }

        .focus-card::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(15, 29, 43, 0.05);
            pointer-events: none;
        }

        .focus-card:hover {
            border-color: var(--antique-gold);
            background-color: var(--white);
            transform: translateY(-5px);
        }

        .focus-card i {
            font-size: 1.8rem;
            color: var(--antique-gold);
            margin-bottom: 2rem;
        }

        .focus-card h3 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .focus-card p {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.8;
        }

        /* About Section */
        .about-wrapper {
            display: flex;
            align-items: center;
            gap: 6rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .about-image-container {
            flex: 1;
            padding: 1rem;
            border: 1px solid var(--antique-gold);
            position: relative;
        }

        .about-image {
            aspect-ratio: 3/4;
            background-color: var(--parchment-dark);
            position: relative;
            overflow: hidden;
        }

        .about-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 15%;
            display: block;
            transition: transform 0.7s ease;
        }

        .about-image-container:hover img {
            transform: scale(1.03);
        }

        .about-content {
            flex: 1;
        }

        .about-content h3 {
            font-size: 2.6rem;
            margin-bottom: 2rem;
            line-height: 1.1;
            font-weight: 500;
        }

        .about-content p {
            margin-bottom: 1.8rem;
            color: var(--text-dark);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        /* Experience Timeline */
        .experience {
            background-color: var(--oxford-blue);
            color: var(--parchment);
            position: relative;
        }

        .experience .section-header h2 {
            color: var(--parchment);
        }

        .timeline {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .timeline-item {
            padding-left: 3rem;
            border-left: 1px solid var(--gold-light);
            margin-bottom: 4rem;
            position: relative;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -4px;
            top: 5px;
            width: 7px;
            height: 7px;
            background-color: var(--antique-gold);
            transform: rotate(45deg); /* Diamond shape */
        }

        .timeline-date {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            color: var(--antique-gold);
            margin-bottom: 0.8rem;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .timeline-title {
            font-size: 1.8rem;
            color: var(--parchment);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .timeline-desc {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.8;
            font-weight: 300;
        }

        /* Footer */
        footer {
            background-color: var(--oxford-dark);
            color: var(--parchment);
            text-align: center;
            padding: 6rem 5% 4rem;
            border-top: 1px solid var(--gold-light);
        }

        .footer-logo {
            display: inline-block;
            margin-bottom: 3rem;
        }

        .footer-logo img {
            height: 110px; 
            width: auto;
            mix-blend-mode: lighten;
            opacity: 0.85;
            transition: var(--transition);
        }
        
        .footer-logo img:hover {
            opacity: 1;
        }

        .social-links {
            margin-bottom: 3rem;
        }

        .social-links a {
            display: inline-block;
            margin: 0 1rem;
            font-size: 1.2rem;
            color: var(--antique-gold);
            width: 45px;
            height: 45px;
            line-height: 45px;
            border: 1px solid var(--gold-light);
            transition: var(--transition);
            border-radius: 2px; /* Slight rounding for old-world feel */
        }

        .social-links a:hover {
            color: var(--oxford-dark);
            background-color: var(--antique-gold);
            border-color: var(--antique-gold);
            transform: translateY(-3px);
        }

        .contact-email {
            display: block;
            margin-bottom: 3rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--parchment);
            letter-spacing: 1px;
        }
        
        .contact-email:hover {
            color: var(--antique-gold);
        }

        .footer-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            color: rgba(244, 241, 234, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .about-wrapper {
                flex-direction: column;
                gap: 4rem;
            }
            .about-image-container {
                width: 100%;
                max-width: 450px;
                margin: 0 auto;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: var(--oxford-blue);
                flex-direction: column;
                align-items: center;
                padding: 3rem 0;
                gap: 2rem;
                opacity: 0;
                visibility: hidden;
                transform: translateY(-10px);
                transition: var(--transition);
                border-top: 1px solid var(--gold-light);
                border-bottom: 1px solid var(--gold-light);
            }

            .nav-links.active {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }
            
            nav {
                background-color: var(--oxford-blue);
                padding: 1rem 5%;
            }

            .hamburger {
                display: block;
            }

            section {
                padding: 5rem 5%;
            }
            
            .hero h1 {
                font-size: 3rem;
            }
        }

        /* Scroll Reveal Animations */
        .reveal {
            opacity: 1;
            transform: translateY(0px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </script>
</body>
</html>
